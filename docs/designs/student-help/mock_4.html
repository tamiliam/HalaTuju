<html><head><meta charset=utf-8><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;font-family:Lexend,'Segoe UI',Arial,sans-serif;color:#1e293b;width:390px;font-size:15px;line-height:1.45}
.top{background:#fff;padding:14px 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:18px}
.wrap{padding:16px 20px 28px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#475569;margin:22px 0 10px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px -2px rgba(0,0,0,.06)}
.card b{font-size:16px}.why{color:#475569;font-size:13.5px;margin:4px 0 12px}
.btn{display:block;width:100%;text-align:center;border-radius:8px;padding:12px;font-weight:600;font-size:15px;border:0}
.pri{background:#137fec;color:#fff}.sec{background:#fff;color:#1066c2;border:1.5px solid #137fec}
.small{display:inline-block;width:auto;padding:8px 16px;font-size:14px}
.link{color:#1066c2;font-size:13px;text-decoration:underline;display:inline-block;margin-top:10px}
.note{font-size:12.5px;color:#64748b;margin-top:6px}
.amber{background:#fff7e6;border:1px solid #f5c76b;color:#7a4b00;border-radius:8px;padding:10px;font-size:13.5px;margin-bottom:12px}
.red{background:#fdecea;border:1px solid #f3a7a0;color:#9b1c13;border-radius:8px;padding:10px;font-size:13.5px;margin-bottom:12px}
.green{color:#1c7a36;font-weight:600}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:43%;background:#137fec}
.file{display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0 12px}
.tap{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:12px;font-size:14.5px;margin-bottom:8px}
.tap.on{border-color:#137fec;background:#eff6ff;font-weight:600}
.cap{font-size:12px;color:#94a3b8;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;height:80px;border:2px solid #137fec;border-radius:8px;padding:10px;font:inherit;font-size:14px;margin:8px 0}
.cancel{text-align:center;color:#475569;font-size:14px;padding:8px;text-decoration:underline}
</style></head><body><div style="background:rgba(15,23,42,.55);min-height:844px;position:relative"><div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 20px 24px">
<div style="width:40px;height:4px;background:#cbd5e1;border-radius:9px;margin:0 auto 14px"></div>
<b style="font-size:17px">Sample: Payslip</b>
<div style="margin:12px 0;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden"><img src="samples/payslip.svg" style="width:100%;display:block"></div>
<div style="font-weight:600;margin-bottom:6px">What we check</div>
<div style="font-size:14px">1. Worker name matches<br>2. Month is recent<br>3. Gross pay is shown<br>4. Employer name is shown</div>
<div class=note style="margin:10px 0 14px">This is a drawing, not a real payslip. Do not upload it.</div>
<span class="btn pri">Close</span></div></div></body></html>
