<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 1163" width="1208" height="1163"><rect x="0" y="0" width="1208" height="1163" fill="#f4f5f7" stroke="none" stroke-width="1" rx="0" /><rect x="24" y="25" width="794" height="1123" fill="#000" stroke="none" stroke-width="1" rx="0" opacity=".12"/><g transform="translate(20 20)"><rect x="0" y="0" width="794" height="1123" fill="#fff" stroke="#ccc" stroke-width="1" rx="0" /><g transform="translate(62 40) scale(0.95)"><path d="M0 0 Q35 8 70 0 L70 44 Q70 72 35 88 Q0 72 0 44Z" fill="#c9cdd2" stroke="#aeb3b9" stroke-width="2"/><path d="M35 14 l7 16 17 2-13 12 4 17-15-9-15 9 4-17-13-12 17-2z" fill="#e3e6e9"/></g><text x="432" y="72" font-size="27" font-weight="bold" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" >SMK CONTOH</text><text x="432" y="92" font-size="12.5" font-weight="normal" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" >SEKOLAH MENENGAH KEBANGSAAN CONTOH</text><text x="432" y="109" font-size="12" font-weight="normal" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" >No. 1, Jalan Contoh, 00000 Bandar Contoh, Negeri Contoh</text><text x="432" y="124" font-size="12" font-weight="normal" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" >Tel: 00-000 0000   |   E-mel: contoh@moe.edu.my</text><line x1="55" y1="142" x2="739" y2="142" stroke="#111" stroke-width="2.2"/><line x1="55" y1="146" x2="739" y2="146" stroke="#111" stroke-width="0.8"/><text x="70" y="182" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Ruj. Kami : SMKC/SS/000/2026</text><text x="70" y="206" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Tarikh      : 14 November 2026</text><text x="70" y="254" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Kepada Sesiapa Yang Berkenaan,</text><text x="70" y="290" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Tuan/Puan,</text><text x="70" y="328" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >SURAT SOKONGAN : NAMA CONTOH A/L CONTOH (NO. K/P: 000000-00-0000)</text><line x1="70" y1="333" x2="640" y2="333" stroke="#111" stroke-width="1"/><text x="70" y="368" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Dengan segala hormatnya perkara di atas adalah dirujuk.</text><text x="70" y="406" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >2.  Dimaklumkan bahawa NAMA CONTOH A/L CONTOH (No. K/P: 000000-00-0000) merupakan</text><text x="70" y="430" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >bekas murid Tingkatan 5 di SMK Contoh dan telah menduduki Sijil Pelajaran Malaysia</text><text x="70" y="454" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >(SPM) pada tahun 2025.</text><text x="70" y="492" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >3.  Sepanjang berada di sekolah ini, beliau seorang murid yang berdisiplin, rajin dan</text><text x="70" y="516" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >bertanggungjawab. Beliau berasal daripada keluarga yang kurang berkemampuan dan layak</text><text x="70" y="540" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >dipertimbangkan untuk menerima bantuan pendidikan.</text><text x="70" y="578" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >4.  Sehubungan itu, pihak sekolah menyokong permohonan beliau untuk melanjutkan</text><text x="70" y="602" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >pengajian ke peringkat yang lebih tinggi. Sokongan ini diberikan atas permintaan</text><text x="70" y="626" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >pelajar berkenaan.</text><text x="70" y="664" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Sekian, terima kasih.</text><text x="70" y="708" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Yang benar,</text><path d="M80 772 C84 737 93 792 99 779 C102 807 112 753 117 764 C121 799 130 749 136 780 C139 805 149 742 154 770 C158 746 167 793 173 779 C177 810 186 739 191 765 C195 744 204 790 210 778 L220 778" fill="none" stroke="#1d2a6b" stroke-width="1.8" stroke-linecap="round" opacity=".9"/><g transform="rotate(-7 270 782)" opacity=".78"><ellipse cx="270" cy="782" rx="98" ry="54" fill="none" stroke="#2b3a9e" stroke-width="2.6"/><ellipse cx="270" cy="782" rx="92" ry="48" fill="none" stroke="#2b3a9e" stroke-width="1"/><text x="270" y="767.05" font-size="13" font-weight="bold" fill="#2b3a9e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >GURU BESAR</text><text x="270" y="786.55" font-size="13" font-weight="bold" fill="#2b3a9e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >SMK CONTOH</text><text x="270" y="806.05" font-size="10.5" font-weight="normal" fill="#2b3a9e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >00000 BANDAR CONTOH</text></g><line x1="70" y1="832" x2="260" y2="832" stroke="#111" stroke-width="0.8"/><text x="70" y="854" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >(NAMA CONTOH BIN CONTOH)</text><text x="70" y="874" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Guru Besar</text><text x="70" y="892" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >SMK Contoh, 00000 Bandar Contoh</text></g><g transform="translate(20 20)"><g transform="rotate(-45 397 560)" opacity="0.22"><rect x="182" y="445" width="430" height="230" rx="20" fill="none" stroke="#d92d20" stroke-width="7"/><text x="397" y="555" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">CONTOH</text><text x="397" y="645" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">SAMPLE</text></g><g transform="rotate(-18 640 860)" opacity="0.3"><rect x="545" y="810" width="190" height="101" rx="9" fill="none" stroke="#d92d20" stroke-width="3"/><text x="640" y="858" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">CONTOH</text><text x="640" y="898" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">SAMPLE</text></g></g><line x1="812.0" y1="882.0" x2="291.0" y2="882.0" stroke="#d92d20" stroke-width="2.5"/><polygon points="282.0,882.0 291.0,877.0 291.0,887.0" fill="#d92d20"/><circle cx="826" cy="882" r="14" fill="#d92d20"/><text x="826" y="887.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >1</text><line x1="812.0" y1="802.0" x2="401.0" y2="802.0" stroke="#d92d20" stroke-width="2.5"/><polygon points="392.0,802.0 401.0,797.0 401.0,807.0" fill="#d92d20"/><circle cx="826" cy="802" r