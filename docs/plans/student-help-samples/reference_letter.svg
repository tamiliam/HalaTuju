text><text x="906" y="148" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >stamp of the school / office</text><circle cx="886" cy="175" r="10" fill="#d92d20"/><text x="886" y="179" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >3</text><text x="906" y="180" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Student's name and IC number</text><text x="906" y="198" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >match the MyKad</text><circle cx="886" cy="225" r="10" fill="#d92d20"/><text x="886" y="229" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >4</text><text x="906" y="230" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Date of the letter</text><text x="906" y="248" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >(recent, not old)</text></svg>