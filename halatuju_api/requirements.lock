# The production runtime, frozen.
#
# This is an exact record of what pip installed in the production image build of
# 2026-09-18 (commit c658a1b) — not a fresh resolve. The Dockerfile installs THIS
# file, so two builds of the same commit install the same code.
#
# `requirements.txt` is still the source of INTENT: it states the version ranges a
# package is allowed to move within, and the comments explaining why each one is here.
# This file is the answer that intent resolved to on one particular day.
#
# To refresh it deliberately (never as a side effect of another change):
#   1. Build the image without the lock: temporarily `pip install -r requirements.txt`.
#   2. Read the "Successfully installed ..." line from the build log — that is the new set.
#   3. Rewrite this file from that line (one `name==version` per package, sorted).
#   4. REVIEW THE DIFF. Every moved version is a change to what production runs and
#      belongs in its own commit, with the suite green against it.
#
# pip, setuptools and wheel are not listed: they come from the python:3.11-slim base image.
