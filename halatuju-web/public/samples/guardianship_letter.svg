<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 1163" width="1208" height="1163"><rect x="0" y="0" width="1208" height="1163" fill="#f4f5f7" stroke="none" stroke-width="1" rx="0" /><rect x="24" y="25" width="794" height="1123" fill="#000" stroke="none" stroke-width="1" rx="0" opacity=".12"/><g transform="translate(20 20)"><rect x="0" y="0" width="794" height="1123" fill="#fff" stroke="#ccc" stroke-width="1" rx="0" /><text x="397" y="78" font-size="21" font-weight="bold" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" >SURAT KUASA / KEBENARAN PENJAGA</text><line x1="212" y1="85" x2="582" y2="85" stroke="#111" stroke-width="1.4"/><text x="397" y="104" font-size="12.5" font-weight="normal" fill="#111" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-style="italic" >(Surat Akuan Ibu / Bapa)</text><text x="70" y="150" font-size="13" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >No. 1, Jalan Contoh,</text><text x="70" y="168" font-size="13" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Kampung Contoh, 00000 Bandar Contoh</text><text x="724" y="150" font-size="13" font-weight="normal" fill="#111" text-anchor="end" font-family="'Times New Roman', Times, serif" >Tarikh : 14 November 2026</text><text x="70" y="214" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Saya, NAMA BAPA CONTOH BIN CONTOH, No. Kad Pengenalan 000000-00-0000, ialah BAPA</text><text x="70" y="238" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >kepada pelajar yang dinamakan di bawah:</text><text x="100" y="276" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Nama pelajar</text><text x="290" y="276" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >:</text><text x="306" y="276" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >NAMA CONTOH A/L CONTOH</text><text x="100" y="304" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >No. Kad Pengenalan</text><text x="290" y="304" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >:</text><text x="306" y="304" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >000000-00-0000</text><text x="70" y="350" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Dengan ini saya membenarkan dan melantik orang yang dinamakan di bawah sebagai PENJAGA</text><text x="70" y="374" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >pelajar tersebut:</text><text x="100" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Nama penjaga</text><text x="290" y="412" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >:</text><text x="306" y="412" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >NAMA PENJAGA CONTOH BIN CONTOH</text><text x="100" y="440" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >No. Kad Pengenalan</text><text x="290" y="440" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >:</text><text x="306" y="440" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >000000-00-0000</text><text x="100" y="468" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Hubungan dengan pelajar</text><text x="290" y="468" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >:</text><text x="306" y="468" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >BAPA SAUDARA</text><text x="70" y="514" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Penjaga tersebut diberi kuasa untuk bertindak bagi pihak saya dan pelajar itu dalam</text><text x="70" y="538" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >permohonan bantuan pendidikan ini, termasuk memberi persetujuan dan menandatangani</text><text x="70" y="562" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >borang yang berkaitan. Pelajar itu tinggal di bawah jagaannya kerana saya tidak dapat</text><text x="70" y="586" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >menjaganya sepenuhnya.</text><text x="70" y="620" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="'Times New Roman', Times, serif" >Saya mengesahkan bahawa maklumat di atas adalah benar.</text><path d="M80 724 C83 765 92 687 97 728 C101 756 109 693 114 719 C118 759 126 688 131 718 C135 748 143 694 149 730 C152 689 161 750 166 723 C169 689 178 761 183 717 C186 699 195 747 200 716 L210 730" fill="none" stroke="#1d2a6b" stroke-width="1.8" stroke-linecap="round" opacity=".9"/><line x1="70" y1="754" x2="260" y2="754" stroke="#111" stroke-width="0.8"/><text x="70" y="774" font-size="13" font-weight="bold" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >(NAMA BAPA CONTOH BIN CONTOH)</text><text x="70" y="792" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Bapa pelajar   |   No. K/P: 000000-00-0000</text><text x="70" y="810" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Times New Roman', Times, serif" >Tarikh: 14 November 2026</text></g><g transform="translate(20 20)"><g transform="rotate(-45 397 560)" opacity="0.22"><rect x="182" y="445" width="430" height="230" rx="20" fill="none" stroke="#d92d20" stroke-width="7"/><text x="397" y="555" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">CONTOH</text><text x="397" y="645" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">SAMPLE</text></g><g transform="rotate(-18 640 860)" opacity="0.3"><rect x="545" y="810" width="190" height="101" rx="9" fill="none" stroke="#d92d20" stroke-width="3"/><text x="640" y="858" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">CONTOH</text><text x="640" y="898" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">SAMPLE</text></g></g><line x1="812.0" y1="234.0" x2="719.0" y2="234.0" stroke="#d92d20" stroke-width="2.5"/><polygon points="710.0,234.0 719.0,229.0 719.0,239.0" fill="#d92d20"/><circle cx="826" cy="234" r="14" fill="#d92d20"/><text x="826" y="239.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >1</text><line x1="812.0" y1="296.0" x2="549.0" y2="296.0" stroke="#d92d20" stroke-width="2.5"/><polygon points="540.0,296.0 549.0,291.0 549.0,301.0" fill="#d92d20"/><circle cx="826" cy="296" r="14" fill="#d92