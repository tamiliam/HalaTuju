font-weight="bold" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Course</text><text x="140" y="212" font-size="13.5" font-weight="normal" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >:</text><text x="154" y="212" font-size="13.5" font-weight="normal" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Diploma in Mechanical Engineering, Politeknik Contoh</text><line x1="70" y1="244" x2="724" y2="244" stroke="#999" stroke-width="0.8"/><text x="70" y="280" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >To the Selection Committee,</text><text x="70" y="316" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >I am writing to apply for support to continue my studies. I have just finished SPM and I</text><text x="70" y="340" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >have been offered a place to study Mechanical Engineering, because I want to become an</text><text x="70" y="364" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >engineer who repairs and maintains machines in factories near my hometown.</text><text x="70" y="406" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >I come from a small family. My father works as a lorry driver and my mother helps at</text><text x="70" y="430" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >home. Our monthly income is small and we have five people in the household, so paying</text><text x="70" y="454" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >for fees, books and transport is very hard for us.</text><text x="70" y="496" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >At school I was a prefect and the secretary of the Robotics Club. I enjoy fixing broken</text><text x="70" y="520" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >fans and radios for my neighbours. These experiences taught me to be patient and to work</text><text x="70" y="544" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >in a team.</text><text x="70" y="586" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >If I receive this support, I promise to study hard and to help other students in my</text><text x="70" y="610" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >kampung once I have graduated. Thank you for reading my statement and for your kind</text><text x="70" y="634" font-size="14" font-weight="normal" fill="#111" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >consideration.</text><text x="70" y="686" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Yours sincerely,</text><path d="M80 740 C83 710 92 767 97 737 C101 696 109 768 114 747 C118 708 126 763 131 732 C135 783 143 713 149 734 C152 698 161 774 166 739 C169 775 178 722 183 737 C186 777 195 708 200 747 L210 746" fill="none" stroke="#1d2a6b" stroke-width="1.8" stroke-linecap="round" opacity=".9"/><line x1="70" y1="768" x2="250" y2="768" stroke="#111" stroke-width="0.8"/><text x="70" y="788" font-size="14" font-weight="bold" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >NAMA CONTOH A/L CONTOH</text><text x="70" y="808" font-size="14" font-weight="normal" fill="#222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Date: 14 November 2026</text></g><g transform="translate(20 20)"><g transform="rotate(-45 397 560)" opacity="0.22"><rect x="182" y="445" width="430" height="230" rx="20" fill="none" stroke="#d92d20" stroke-width="7"/><text x="397" y="555" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">CONTOH</text><text x="397" y="645" font-size="100" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">SAMPLE</text></g><g transform="rotate(-18 640 880)" opacity="0.3"><rect x="545" y="830" width="190" height="101" rx="9" fill="none" stroke="#d92d20" stroke-width="3"/><text x="640" y="878" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">CONTOH</text><text x="640" y="918" font-size="44" font-weight="bold" fill="#d92d20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">SAMPLE</text></g></g><line x1="812.0" y1="227.0" x2="534.0" y2="227.0" stroke="#d92d20" stroke-width="2.5"/><polygon points="525.0,227.0 534.0,222.0 534.0,232.0" fill="#d92d20"/><circle cx="826" cy="227" r="14" fill="#d92d20"/><text x="826" y="232.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >1</text><line x1="812.1" y1="348.0" x2="693.9" y2="364.7" stroke="#d92d20" stroke-width="2.5"/><polygon points="685.0,366.0 693.2,359.8 694.6,369.7" fill="#d92d20"/><circle cx="826" cy="346" r="14" fill="#d92d20"/><text x="826" y="351.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >2</text><line x1="812.1" y1="438.0" x2="693.9" y2="454.7" stroke="#d92d20" stroke-width="2.5"/><polygon points="685.0,456.0 693.2,449.8 694.6,459.7" fill="#d92d20"/><circle cx="826" cy="436" r="14" fill="#d92d20"/><text x="826" y="441.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >3</text><line x1="812.0" y1="827.9" x2="269.0" y2="824.1" stroke="#d92d20" stroke-width="2.5"/><polygon points="260.0,824.0 269.0,819.1 269.0,829.1" fill="#d92d20"/><circle cx="826" cy="828" r="14" fill="#d92d20"/><text x="826" y="833.95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >4</text><rect x="858" y="20" width="330" height="256" fill="#fdf3f2" stroke="#d92d20" stroke-width="1.2" rx="8" /><text x="876" y="52" font-size="18" font-weight="bold" fill="#d92d20" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >What we check</text><circle cx="886" cy="75" r="10" fill="#d92d20"/><text x="886" y="79" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >1</text><text x="906" y="80" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Your name, IC number and</text><text x="906" y="98" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >the course you want to study</text><circle cx="886" cy="125" r="10" fill="#d92d20"/><text x="886" y="129" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >2</text><text x="906" y="130" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Your goals: what you want</text><text x="906" y="148" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >to do after your studies</text><circle cx="886" cy="175" r="10" fill="#d92d20"/><text x="886" y="179" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >3</text><text x="906" y="180" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Your background: family,</text><text x="906" y="198" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >interests, experiences</text><circle cx="886" cy="225" r="10" fill="#d92d20"/><text x="886" y="229" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" >4</text><text x="906" y="230" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Your signature (or typed</text><text x="906" y="248" font-size="14" font-weight="normal" fill="#333" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >name) and the date</text></svg>